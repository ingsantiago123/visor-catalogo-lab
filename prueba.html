  <!--
    Banco de pruebas de LA CADENA COMPLETA del visor (ver
    visor-instrucciones.md, §11). Este archivo hace las veces de anfitrión:
    en vez de que el visor haga fetch() a nada, el iframe le entrega el JSON
    COMPLETO y REAL de los 132 laboratorios directo en su atributo name,
    apuntando a ./index.html (Pantalla 1, acá mismo en este repo) — el visor
    no sabe ni le importa que estos datos vengan de un archivo hardcodeado
    en vez de una red real: es exactamente el mismo punto de partida que
    usaría cualquier anfitrión externo real.

    Desde acá se puede recorrer la cadena entera con clicks reales:
    Pantalla 1 (elegir colección) -> Pantalla 2 (elegir programa, derivado
    del mismo array) -> Pantalla 3 (catálogo de ese programa) — todo sin
    que NINGUNA de las 3 pantallas vuelva a tocar la red ni una sola vez.

    Si este iframe no tuviera name (o viniera vacío/corrupto), cada
    pantalla cae en su estado "sin datos" — nunca un error, nunca una
    pantalla en blanco.

    El JSON va con comillas dobles escapadas como &quot; (es un atributo
    HTML, no una cadena JS) porque el iframe usa name='...' con comillas
    simples.
  -->
  <iframe
    title="Visor (prueba - cadena completa)"
    style="width:100vw;height:calc(100vh - 32px);border:0;display:block;position:absolute;top:32px;left:0;"

s); Biomecánica del Ejercicio (Cultura Física y Deporte)&quot;,&quot;Descripción &quot;:&quot;Laboratorio de recolección de datos de tiro parabólico. El estudiante dispara proyectiles variando ángulo, velocidad inicial, masa y resistencia del aire, y registra alcance, altura máxima y tiempo de vuelo en una tabla de datos editable. Está pensado para practicar el método científico completo: formular hipótesis, tomar mediciones repetidas, calcular incertidumbre y contrastar los resultados experimentales contra el modelo teórico del movimiento parabólico sin fricción.&quot;,&quot;Guía en la web&quot;:&quot;Guía docente disponible en la pestaña &#39;For Teachers&#39; de la propia página del recurso (mismo enlace de la columna Link del Recurso).&quot;,&quot;Costo&quot;:&quot;Gratuito / $0&quot;,&quot;Acceso a la guía/actividad oficial (verificado)&quot;:&quot;Requiere cuenta gratuita de educador en phet.colorado.edu para descargar la guía docente / actividad oficial (pestaña &#39;For Teachers&#39;). La simulación en sí se usa sin ningún registro, pero la guía y las actividades enviadas por otros docentes SÍ están detrás de ese login gratuito.&quot;,&quot;Propuesta de guía y actividad (Claude)&quot;:&quot;OBJETIVO: Que el estudiante relacione las variables que controla en «Laboratorio de Datos de Proyectiles» con el fenómeno mecánico que representa. ACTIVIDAD PROPUESTA: (1) Explorar libremente «Laboratorio de Datos de Proyectiles» durante 5 minutos identificando qué variables se pueden modificar. (2) Fijar una variable y registrar en una tabla al menos 5 mediciones cambiando solo otra variable. (3) Graficar los datos recogidos y proponer una relación matemática entre las dos variables. PREGUNTA DE EVALUACIÓN: ¿Qué variable tuvo mayor efecto sobre el resultado observado y por qué, según la teoría vista en clase?&quot;,&quot;imagen&quot;:&quot;https://phet.colorado.edu/sims/html/projectile-data-lab/latest/projectile-data-lab-900.png&quot;},{&quot;No.&quot;:4,&quot;Nombre del Laboratorio&quot;:&quot;Leyes de Kepler&quot;,&quot;Categoría&quot;:&quot;Movimiento&quot;,&quot;Compatible con Moodle&quot;:&quot;Si&quot;,&quot;Link del Recurso&quot;:&quot;https://phet.colorado.edu/sims/html/keplers-laws/latest/keplers-laws_es.html&quot;,&quot;Origen / Plataforma&quot;:&quot;PhET&quot;,&quot;Aplica a&quot;:&quot;Transversal&quot;,&quot;Programa(s)&quot;:&quot;Ingeniería Mecánica, Ingeniería Electrónica, Ingeniería de Sistemas, Ingeniería Industrial, Ingeniería de Alimentos; Cultura Física y Deporte&quot;,&quot;Materias&quot;:&quot;Física Mecánica y Laboratorio de Física Mecánica (Ing. Mecánica, Electrónica, Sistemas, Industrial, Alimentos); Biomecánica del Ejercicio (Cultura Física y Deporte)&quot;,&quot;Descripción &quot;:&quot;Explora las tres leyes de Kepler sobre el movimiento planetario: órbitas elípticas, la ley de áreas iguales en tiempos iguales y la relación entre el periodo orbital y el semieje mayor. El estudiante modifica la excentricidad de la órbita, mide velocidades en distintos puntos de la trayectoria y verifica numéricamente cada ley, conectando conceptos de mecánica clásica con astronomía y con el concepto físico de conservación del momento angular.&quot;,&quot;Guía en la web&quot;:&quot;Guía docente disponible en la pestaña &#39;For Teachers&#39; de la propia página del recurso (mismo enlace de la columna Link del Recurso).&quot;,&quot;Costo&quot;:&quot;Gratuito / $0&quot;,&quot;Acceso a la guía/actividad oficial (verificado)&quot;:&quot;Requiere cuenta gratuita de educador en phet.colorado.edu para descargar la guía docente / actividad oficial (pestaña &#39;For Teachers&#39;). La simulación en sí se usa sin ningún registro, pero la guía y las actividades enviadas por otros docentes SÍ están detrás de ese login gratuito.&quot;,&quot;Propuesta de guía y actividad (Claude)&quot;:&quot;OBJETIVO: Que el estudiante relacione las variables que controla en «Leyes de Kepler» con el fenómeno mecánico que representa. ACTIVIDAD PROPUESTA: (1) Explorar libremente «Leyes de Kepler» durante 5 minutos identificando qué variables se pueden modificar. (2) Fijar una variable y registrar en una tabla al menos 5 mediciones cambiando solo otra variable. (3) Graficar los datos recogidos y proponer una relación matemática entre las dos variables. PREGUNTA DE EVALUACIÓN: ¿Qué variable tuvo mayor efecto sobre el resultado observado y por qué, según la teoría vista en clase?&quot;,&quot;imagen&quot;:&quot;https://phet.colorado.edu/sims/html/keplers-laws/latest/keplers-laws-900.png&quot;},{&quot;No.&quot;:5,&quot;Nombre del Laboratorio&quot;:&quot;Mi Sistema Solar&quot;,&quot;Categoría&quot;:&quot;Movimiento&quot;,&quot;Compatible con Moodle&quot;:&quot;Si&quot;,&quot;Link del Recurso&quot;:&quot;https://phet.colorado.edu/sims/html/my-solar-system/latest/my-solar-system_es.html&quot;,&quot;Origen / Plataforma&quot;:&quot;PhET&quot;,&quot;Aplica a&quot;:&quot;Transversal&quot;,&quot;Programa(s)&quot;:&quot;Ingeniería Mecánica, Ingeniería Electrónica, Ingeniería de Sistemas, Ingeniería Industrial, Ingeniería de Alimentos; Cultura Física y Deporte&quot;,&quot;Materias&quot;:&quot;Física Mecánica y Laboratorio de Física Mecánica (Ing. Mecánica, Electrónica, Sistemas, Industrial, Alimentos); Biomecánica del Ejercicio (Cultura Física y Deporte)&quot;,&quot;Descripción &quot;:&quot;Sistema solar interactivo y configurable donde el estudiante crea sistemas gravitacionales propios (número de cuerpos, masas, posiciones y velocidades iniciales) y observa la evolución orbital resultante en tiempo real. Permite comprobar estabilidad orbital, órbitas caóticas y el efecto de la masa sobre la trayectoria, siendo una herramienta central para introducir gravitación universal, fuerza centrípeta y las leyes de Newton aplicadas a sistemas de varios cuerpos.&quot;,&quot;Guía en la web&quot;:&quot;Guía docente disponible en la pestaña &#39;For Teachers&#39; de la propia página del recurso (mismo enlace de la columna Link del Recurso).&quot;,&quot;Costo&quot;:&quot;Gratuito / $0&quot;,&quot;Acceso a la guía/actividad oficial (verificado)&quot;:&quot;Requiere cuenta gratuita de educador en phet.colorado.edu para descargar la guía docente / actividad oficial (pestaña &#39;For Teachers&#39;). La simulación en sí se usa sin ningún registro, pero la guía y las actividades enviadas por otros docentes SÍ están detrás de ese login gratuito.&quot;,&quot;Propuesta de guía y actividad (Claude)&quot;:&quot;OBJETIVO: Que el estudiante relacione las variables que controla en «Mi Sistema Solar» con el fenómeno mecánico que representa. ACTIVIDAD PROPUESTA: (1) Explorar libremente «Mi Sistema Solar» durante 5 minutos identificando qué variables se pueden modificar. (2) Fijar una variable y registrar en una tabla al menos 5 mediciones cambiando solo otra variable. (3) Graficar los datos recogidos y proponer una relación matemática entre las dos variables. PREGUNTA DE EVALUACIÓN: ¿Qué variable tuvo mayor efecto sobre el resultado observado y por qué, según la teoría vista en clase?&quot;,&quot;imagen&quot;:&quot;https://phet.colorado.edu/sims/html/my-solar-system/latest/my-solar-system-900.png&quot;},{&quot;No.&quot;:6,&quot;Nombre del Laboratorio&quot;:&quot;Graficador para Cálculo&quot;,&quot;Categoría&quot;:&quot;Movimiento&quot;,&quot;Compatible con Moodle&quot;:&quot;Si&quot;,&quot;Link del Recurso&quot;:&quot;https://phet.colorado.edu/sims/html/calculus-grapher/latest/calculus-grapher_es.html&quot;,&quot;Origen / Plataforma&quot;:&quot;PhET&quot;,&quot;Aplica a&quot;:&quot;Transversal&quot;,&quot;Programa(s)&quot;:&quot;Ingeniería Mecánica, Ingeniería Electrónica, Ingeniería de Sistemas, Ingeniería Industrial, Ingeniería de Alimentos; Cultura Física y Deporte&quot;,&quot;Materias&quot;:&quot;Física Mecánica y Laboratorio de Física Mecánica (Ing. Mecánica, Electrónica, Sistemas, Industrial, Alimentos); Biomecánica del Ejercicio (Cultura Física y Deporte)&quot;,&quot;Descripción &quot;:&quot;Graficador interacti
